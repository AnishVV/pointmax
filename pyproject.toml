[project]
name = "pointmax"
version = "0.1.0"
description = "Find the cheapest-in-real-terms award flight, including positioning legs, via PointsYeah."
readme = "README.md"
authors = [{ name = "Anish" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "cryptography>=43",
    "playwright>=1.47",
    "browser-cookie3>=0.19",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.8",
]

[project.scripts]
pointmax = "pointmax.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real PointsYeah API; needs a session (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/pointmax/cli.py" = ["B008"]  # typer.Option in defaults is the typer idiom
"tests/*" = ["E501", "RUF001", "RUF003"]
